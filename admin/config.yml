backend:
  name: github
  repo: alexrodriguesp/webpage
  branch: main  # Altera para master se a tua branch principal for master
  base_url: https://gh-bearer.net
  auth_endpoint: auth
  client_id: TEU_CLIENT_ID_AQUI  # Cola aqui o Client ID gerado no GitHub OAuth

media_folder: "uploads"
public_folder: "/webpage/uploads"

collections:
  - name: "posts"
    label: "Posts do Blog"
    folder: "_posts"
    create: true
    slug: "{{year}}-{{month}}-{{day}}-{{slug}}"
    fields:
      - { label: "Layout", name: "layout", widget: "hidden", default: "post" }
      - { label: "Título do Post", name: "title", widget: "string" }
      - { label: "Data de Publicação", name: "date", widget: "datetime" }
      - { label: "Imagem de Capa", name: "image", widget: "image", required: false }
      - { label: "Conteúdo", name: "body", widget: "markdown" }