
<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <meta name="description" content="Blog técnico sobre Linux, infraestrutura, administração de sistemas e tecnologia.">

  <title>Meu Blog Linux</title>

  <!-- Ícone da página -->
  <link rel="icon" href="assets/favicon.ico">

  <!-- CSS principal -->
  <link rel="stylesheet" href="assets/css/style.css">

  <!-- Highlight.js: cores dos códigos -->
  <link
    rel="stylesheet"
    href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.11.1/styles/github-dark.min.css"
  >

  <!-- Bibliotecas externas -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/js-yaml/4.1.0/js-yaml.min.js" defer></script>

  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js" defer></script>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/dompurify/3.2.6/purify.min.js" defer></script>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.11.1/highlight.min.js" defer></script>

  <!-- JavaScript do projeto -->
  <script src="assets/js/markdown.js" defer></script>
  <script src="assets/js/github.js" defer></script>
  <script src="assets/js/app.js" defer></script>
</head>

<body>

  <header class="site-header">
    <div class="header-container">
      <a href="/webpage/" class="site-logo">Meu Blog Linux</a>

      <p class="site-subtitle">
        Linux, infraestrutura e tecnologia
      </p>
    </div>
  </header>

  <main class="main-container">

    <section class="posts-section">
      <div class="section-header">
        <h1>Artigos</h1>
        <p>Conteúdos técnicos e tutoriais sobre tecnologia.</p>
      </div>

      <div id="posts" class="posts-grid">
        <p class="loading-message">Carregando artigos...</p>
      </div>
    </section>

  </main>

  <!-- Modal de leitura -->
  <div class="modal" id="modal" aria-hidden="true">

    <article
      class="modal-content"
      id="modal-content"
      role="dialog"
      aria-modal="true"
      aria-labelledby="article-title"
    >

      <!-- Conteúdo inserido pelo JavaScript -->

    </article>

  </div>

  <footer class="site-footer">
    <p>Meu Blog Linux · Conteúdo sobre tecnologia e infraestrutura.</p>
  </footer>

</body>
</html>
