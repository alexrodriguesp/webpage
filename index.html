<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Meu Blog</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      font-family: 'Segoe UI', sans-serif;
      background: #1e1e2e;
      color: #cdd6f4;
      min-height: 100vh;
      padding: 40px 20px;
    }

    h1 {
      text-align: center;
      font-size: 2rem;
      margin-bottom: 40px;
      color: #f5f5f5;
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
      gap: 24px;
      max-width: 1100px;
      margin: 0 auto;
    }

    .card {
      background: #2a2a3e;
      border-radius: 12px;
      overflow: hidden;
      cursor: pointer;
      transition: transform 0.2s, box-shadow 0.2s;
      border: 1px solid #3b3b50;
    }

    .card:hover {
      transform: translateY(-4px);
      box-shadow: 0 8px 24px rgba(0,0,0,0.4);
    }

    .card img {
      width: 100%;
      height: 180px;
      object-fit: cover;
      display: block;
    }

    .card .no-img {
      width: 100%;
      height: 180px;
      background: #3b3b50;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #6c7086;
      font-size: 2.5rem;
    }

    .card-body {
      padding: 20px;
    }

    .card-body h2 {
      font-size: 1.2rem;
      color: #f5f5f5;
      margin-bottom: 8px;
    }

    .card-body p {
      font-size: 0.9rem;
      color: #a6adc8;
      line-height: 1.5;
      margin-bottom: 16px;
    }

    .card-body .read-more {
      font-size: 0.85rem;
      color: #89b4fa;
      font-weight: 600;
    }

    /* Modal para ler o post completo */
    .modal {
      display: none;
      position: fixed;
      top: 0; left: 0;
      width: 100%; height: 100%;
      background: rgba(0,0,0,0.8);
      z-index: 1000;
      justify-content: center;
      align-items: center;
      padding: 20px;
    }

    .modal.active { display: flex; }

    .modal-content {
      background: #2a2a3e;
      border-radius: 12px;
      max-width: 700px;
      width: 100%;
      max-height: 85vh;
      overflow-y: auto;
      padding: 32px;
      border: 1px solid #3b3b50;
    }

    .modal-content h2 {
      color: #f5f5f5;
      margin-bottom: 12px;
    }

    .modal-content img {
      width: 100%;
      border-radius: 8px;
      margin-bottom: 16px;
    }

    .modal-content .desc {
      color: #a6adc8;
      margin-bottom: 20px;
      font-style: italic;
    }

    .modal-content .body-text {
      line-height: 1.7;
      color: #cdd6f4;
    }

    .close-btn {
      float: right;
      background: none;
      border: none;
      color: #a6adc8;
      font-size: 1.5rem;
      cursor: pointer;
    }

    .close-btn:hover { color: #f5f5f5; }
  </style>
</head>
<body>

<h1>Meu Blog</h1>
<div class="grid" id="posts"></div>

<div class="modal" id="modal">
  <div class="modal-content" id="modal-content"></div>
</div>

<script>
const BASE = '/webpage'; // Nome do seu repositório
const repo = 'alexrodriguesp/webpage';


async function carregarPosts() {
  try {
    const resp = await fetch(`https://api.github.com/repos/${repo}/contents/_posts`);
    const files = await resp.json();
    const container = document.getElementById('posts');
    container.innerHTML = '';

    if (!Array.isArray(files)) {
      container.innerHTML = '<p style="color:#f38ba8;">Erro ao carregar posts. Tente novamente.</p>';
      return;
    }

    for (const file of files) {
      if (!file.name.endsWith('.md')) continue;

      const content = await (await fetch(file.download_url)).text();
      const match = content.match(/^---\n([\s\S]*?)\n---\n([\s\S]*)$/);
      if (!match) continue;

      const front = match[1];
      const body = match[2];

      const getField = (field) => {
        const regex = new RegExp(`^${field}:\\s*(['"]?)(.*?)\\1\\s*$`, 'm');
        const res = front.match(regex);
        return res ? res[2].trim() : '';
      };

      // Limpeza agressiva para remover aspas sobrando, espaços ou traços que venham corrompidos
      let titulo = getField('title').replace(/["']+$/, '').trim();
      let desc = getField('description').replace(/["']+$/, '').trim();
      let img = getField('image').replace(/["']+$/, '').trim();

      // Tratamento do caminho da imagem para o GitHub Pages
      if (img) {
        if (!img.startsWith('http')) {
          const cleanImgPath = img.replace(/^\/+/, '');
          img = `${BASE}/${cleanImgPath}`;
        }
      }

      const card = document.createElement('div');
      card.className = 'card';
      card.innerHTML = `
        ${img
          ? `<img src="${img}" alt="${titulo}" onerror="this.outerHTML='<div class=no-img>📷</div>'">`
          : `<div class="no-img">📷</div>`
        }
        <div class="card-body">
          <h2>${titulo}</h2>
          <p>${desc || 'Clique para ler mais...'}</p>
          <span class="read-more">Ler mais →</span>
        </div>
      `;

      card.onclick = () => abrirModal(titulo, desc, img, body);
      container.appendChild(card);
    }
  } catch (err) {
    console.error(err);
    const container = document.getElementById('posts');
    container.innerHTML = '<p style="color:#f38ba8;">Erro ao conectar com a API do GitHub.</p>';
  }
}

function abrirModal(titulo, desc, img, body) {
  const modal = document.getElementById('modal');
  const content = document.getElementById('modal-content');
  content.innerHTML = `
    <button class="close-btn" onclick="fecharModal()">✕</button>
    ${img ? `<img src="${img}" alt="${titulo}">` : ''}
    <h2>${titulo}</h2>
    ${desc ? `<p class="desc">${desc}</p>` : ''}
    <div class="body-text">${body}</div>
  `;
  modal.classList.add('active');
}

function fecharModal() {
  document.getElementById('modal').classList.remove('active');
}

document.getElementById('modal').onclick = (e) => {
  if (e.target === e.currentTarget) fecharModal();
};

carregarPosts();
</script>

</body>
</html>
