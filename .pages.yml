media:
  input: uploads
  output: /uploads

content:
  - name: posts
    label: Posts
    type: collection
    path: _posts
    fields:
      - name: title
        label: Título
        type: string
      - name: description
        label: Descrição
        type: text
      - name: image
        label: Imagem
        type: image
      - name: body
        label: Conteúdo
        type: markdown