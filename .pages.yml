
media:
  input: uploads
  output: /uploads

content:
  - name: posts
    label: Posts
    type: collection
    path: _posts
    fields:
      - name: title
        label: Título
        type: string

      - name: date
        label: Data
        type: date

      - name: description
        label: Descrição
        type: text

      - name: tags
        label: Tags
        type: string

      - name: image
        label: Imagem
        type: image

      - name: body
        label: Conteúdo
        type: markdown
